default_fqbn: esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,UploadMode=default
default_port: /dev/ttyACM0
default_port_config:
  baudrate: 921600
# UART console metadata only: /dev/ttyACM0 is the CH343 1a86:55d3 bridge used
# for flashing, logs, and calibration. The engine opens native USB directly by
# VID:PID 303a:1002 and does not read this file. Pin the bridge with arduino-cli's
# -p or Makefile's PORT=<node> when tty numbering is ambiguous.
