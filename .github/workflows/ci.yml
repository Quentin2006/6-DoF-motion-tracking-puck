name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Bevy cold-builds in ~36 min on the 2-vCPU runner; cache the engine's
      # target dir + cargo registry so subsequent runs are near-instant.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install Linux system deps (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Test
        run: cargo test

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="${HOME}/bin" sh
          echo "${HOME}/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Install display libs
        run: arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 device
