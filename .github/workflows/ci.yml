name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev \
            libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          mkdir -p "${HOME}/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="${HOME}/bin" sh
          echo "${HOME}/bin" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      # config.h includes device/secrets.h unconditionally; materialize the
      # placeholder so the sketch compiles. Real secrets are never committed.
      - name: Materialize secrets from example
        run: cp device/secrets.h.example device/secrets.h
      - name: Compile firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 device
